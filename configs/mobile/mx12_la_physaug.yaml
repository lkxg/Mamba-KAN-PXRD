experiment:
  name: mx12_la_physaug
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 64
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true
  # Reserved for the later physics-augmentation run. Keep this first
  # Keep augmentation disabled for the initial mx12 architecture/loss run.
  augment:
    enabled: false

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    downsample_token_mixer:
      name: mobilexrd_lite
      global_channels: 96
      local_channels: 32
      identity_channels: 0
      local_kernels: [5, 11, 21]
      dropout: 0.05
      use_wavelet: false
    token_dropout: 0.05
    mamba:
      backend: mamba2_ssm
      wa_layers: 8
      d_state: 32
      headdim: 64
      chunk_size: 256
      dropout: 0.05
    peak_branch:
      enabled: true
      # Vector-gated residual fusion of dense and sparse features.
      fusion: gated_add
      num_peaks: 128
      window: 11
      min_intensity: 0.01
      wavelength: 1.5406
      d_model: 96
      layers: 2
      heads: 4
      ffn_mult: 2.0
      dropout: 0.1
      out_dim: 128
      branch_dropout: 0.05

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 20

train:
  epochs: 120
  grad_clip: 1.0
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, mx12_la_physaug, mobilexrd, learned-downsample, partial-mamba2, peakset, gated-fusion, logit-adjusted-ce, no-augmentation, global96-local32-noid, batch64, d128, main]
    notes: "Initial mx12 control: mx03 plus a PeakSet branch, gated dense/peak fusion, and logit-adjusted cross entropy (tau=1.0). Signal augmentation is intentionally disabled; a later physics-augmentation variant should use a separate experiment ID."
    dir: wandb
    save_code: true

loss:
  name: logit_adjusted_ce
  tau: 1.0
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
