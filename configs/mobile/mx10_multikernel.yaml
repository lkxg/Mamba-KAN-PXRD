experiment:
  name: mx10_multikernel
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 64
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    downsample_multiscale:
      enabled: true
      kernels: [3, 7, 15]
      dilations: [1, 2]
      dropout: 0.0
    downsample_token_mixer:
      name: mobilexrd_lite
      global_channels: 96
      local_channels: 32
      identity_channels: 0
      local_kernels: [5, 11, 21]
      dropout: 0.05
      use_wavelet: false
    token_dropout: 0.05
    mamba:
      backend: mamba2_ssm
      wa_layers: 8
      d_state: 32
      headdim: 64
      chunk_size: 256
      dropout: 0.05

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 20

train:
  epochs: 120
  grad_clip: 1.0
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, mx10_multikernel, mobilexrd, learned-downsample, multikernel-stem, partial-mamba2, global96-local32-noid, batch64, d128, label-smoothing, main]
    notes: mx03_no_identity frontend ablation that keeps the learned-downsample MobileXRD token mixer path but replaces the first downsampling stem with a multi-kernel, dilated peak-shape stem using kernels [3,7,15] and dilations [1,2].
    dir: wandb
    save_code: true

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
