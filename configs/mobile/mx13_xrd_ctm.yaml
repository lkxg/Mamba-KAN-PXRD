experiment:
  name: mx13_xrd_ctm
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 64
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true
  augment:
    enabled: false

model:
  name: xrd_ctm
  xrd_ctm:
    stem_channels: 64
    branch_dropout: 0.05
    cnn:
      stem_factor: 4
      mid_channels: 96
      feature_channels: 128
      stage1_blocks: 2
      stage2_blocks: 2
      stage3_blocks: 2
      dropout: 0.05
      pool_hidden: 128
    mamba:
      backend: mamba2_ssm
      bidirectional: false
      mid_channels: 96
      stage1_layers: 2
      stage2_layers: 4
      d_state: 32
      d_conv: 4
      expand: 2
      headdim: 32
      chunk_size: 256
      dropout: 0.05
      pooling_dropout: 0.05
    peak:
      num_peaks: 128
      detector_window: 11
      prominence_window: 65
      min_prominence: 0.01
      d_model: 128
      num_layers: 4
      num_heads: 8
      ffn_dim: 512
      dropout: 0.10
      feedback_sigma: 3.0
    fusion:
      feedback_scale: 0.10
      dropout: 0.10

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 20
  min_lr: 1.0e-6

train:
  epochs: 120
  grad_clip: 1.0
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, mx13_xrd_ctm, xrd-ctm, cnn-transformer-mamba, unidirectional-mamba2, peak-gap-token, relative-distance-attention, gated-fusion, logit-adjusted-ce, no-augmentation, batch32, main]
    notes: "Full clean XRD-CTM experiment: sample-preserving three-channel stem, local multi-kernel CNN, unidirectional dense Mamba2, peak/gap relative-distance Transformer, cross-branch feedback, quality-aware gated fusion, and three auxiliary space-group heads. No crystal-system head and no signal augmentation."
    dir: wandb
    save_code: true

loss:
  name: logit_adjusted_ce
  tau: 1.0
  label_smoothing: 0.05
  auxiliary_weight: 0.15

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
