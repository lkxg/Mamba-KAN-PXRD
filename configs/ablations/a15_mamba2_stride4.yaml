experiment:
  name: a15_mamba2_stride4
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 64
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range:
    - 5.0
    - 90.0
    use_sa: false
    d_model: 128
    downsample_channels:
    - 64
    - 128
    - 256
    downsample_blocks_per_stage:
    - 2
    - 2
    token_dropout: 0.05
    mamba:
      backend: mamba2_ssm
      d_state: 16
      headdim: 64
      chunk_size: 256
      wa_layers: 8
      dropout: 0.05
    downsample_kernels:
    - 7
    - 4
    - 3
    downsample_strides:
    - 2
    - 2
    - 1
    downsample_paddings:
    - 3
    - 1
    - 1

optim:
  name: adamw
  lr: 0.0006
  weight_decay: 0.0005
  betas:
  - 0.9
  - 0.999

scheduler:
  name: cosine
  warmup_epochs: 20

train:
  epochs: 120
  grad_clip: 1.0
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags:
    - h100
    - a15_mamba2_stride4
    - single-plane
    - learned-downsample
    - mamba2
    - batch64
    - d128
    - label-smoothing
    - main
    - stride4
    - higher-token-resolution
    notes: 'a06_stride4 copied token-resolution ablation with total stride 4 using strides
      [2,2,1] and kernels [7,4,3], changed only to batch size 64 and Mamba2 backend.'
    dir: wandb
    save_code: true

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
