experiment:
  name: b03_resnet18
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true

model:
  name: resnet1d
  resnet1d:
    base_channels: 64
    blocks_per_stage: [2, 2, 2, 2]

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 15

train:
  epochs: 120
  grad_clip: 1.0
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 50

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: offline
    group: main_results
    job_type: train
    tags: [h100, b03_resnet18, resnet1d, resnet18, label-smoothing, main]
    notes: Main ResNet1D-18-style baseline with base_channels 64 and label smoothing CE.
    dir: wandb
    save_code: true

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
