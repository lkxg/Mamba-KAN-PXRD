experiment:
  name: b06_patchtst
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: patchtst
  patchtst:
    patch_len: 64
    stride: 64
    d_model: 192
    n_heads: 8
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 3

train:
  epochs: 30
  grad_clip: 1.0

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: offline
    group: sequence_baselines
    job_type: train
    tags: [h100, b06_patchtst, patchtst, transformer, weighted-ce, label-smoothing, offline]
    notes: PatchTST baseline with b02_resnet_deep mixed weighted CE loss.
    dir: wandb
    save_code: true

loss:
  name: weighted_ce
  label_smoothing: 0.03
  class_weight_power: 0.30

sampler:
  name: none

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
