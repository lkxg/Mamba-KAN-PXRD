experiment:
  name: c01_resnet1d_crystal_label_smoothing
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: crystal_system
  batch_size: 1024
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: resnet1d
  resnet1d:
    base_channels: 64
    blocks_per_stage: [3, 4, 6, 3]

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 5

train:
  epochs: 80
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0
  start_epoch: 30

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: crystal_system
    job_type: train
    tags: [h100, c01, crystal-system, resnet1d, deep, label-smoothing]
    notes: >
      Crystal-system router baseline. Deep ResNet1D predicts the 7
      crystal systems directly from full-range PXRD curves with label smoothing
      and no resampling, intended as the first-stage classifier for hierarchical
      space-group routing.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.03

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
