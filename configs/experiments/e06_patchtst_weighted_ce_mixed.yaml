experiment:
  name: e06_patchtst_weighted_ce_mixed
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 1024
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: patchtst
  patchtst:
    patch_len: 64
    stride: 64
    d_model: 192
    n_heads: 8
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 3

train:
  epochs: 30
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100

logging:
  tensorboard: true
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: offline
    group: sequence_baselines
    job_type: train
    tags: [h100, patchtst, transformer, weighted-ce, label-smoothing, offline]
    notes: PatchTST baseline with E02 mixed weighted CE loss.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: weighted_ce
  label_smoothing: 0.03
  focal_gamma: 2.0
  class_weight_power: 0.30
  class_weight_beta: 0.999

sampler:
  name: none
  power: 0.5
  replacement: true
  num_samples_multiplier: 1.0

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
