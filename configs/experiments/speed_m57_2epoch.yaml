experiment:
  name: speed_m57_2epoch
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 64
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    downsample_token_mixer:
      name: mobilexrd_lite
      global_channels: 64
      local_channels: 32
      identity_channels: 32
      local_kernels: [3, 7, 15]
      dropout: 0.1
      use_wavelet: false
    token_dropout: 0.1
    mamba:
      backend: mamba2_ssm
      wa_layers: 8
      d_state: 32
      headdim: 64
      chunk_size: 256
      dropout: 0.05

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 1

train:
  epochs: 2
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: false
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: false
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m57, mobilexrd, learned-downsample, partial-mamba2, local-conv, batch64, d128, label-smoothing, main]
    notes: M18 learned-downsample frontend with a MobileMamba-inspired partial token mixer using 64 Mamba2, 32 multi-kernel Conv1d, and 32 identity channels.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints/speed_tests
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
