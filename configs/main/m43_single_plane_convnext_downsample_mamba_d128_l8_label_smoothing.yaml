experiment:
  name: m43_single_plane_convnext_downsample_mamba_d128_l8_label_smoothing
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: convnext_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    downsample_convnext:
      kernel_size: 7
      expansion: 4
      layer_scale_init: 1.0e-6
      block_dropout: 0.0
    token_dropout: 0.05
    mamba:
      wa_layers: 8
      dropout: 0.05

optim:
  name: adamw
  lr: 6.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 15

train:
  epochs: 120
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m43, single-plane, convnext-downsample, mamba, d128, label-smoothing, main]
    notes: >
      M18-controlled frontend ablation. Replaces the learned Conv/ResBlock
      downsampling frontend with a stride-8 ConvNeXt-style 1D downsampling
      frontend while keeping the single 5-90 degree WA branch, D=128,
      8 Mamba layers, label smoothing, optimizer, and schedule matched to M18.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: true
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
