experiment:
  name: m28_single_plane_learned_downsample_mamba_d128_l8_kan_proj_supcon_lr3e4
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    token_dropout: 0.05
    projection_head: kan
    projection_dim: 128
    projection_hidden: [256]
    projection_dropout: 0.1
    projection_normalize: true
    kan_grids: 8
    head: mlp
    mamba:
      wa_layers: 8
      dropout: 0.05

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 15

train:
  epochs: 100
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 50

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m28, single-plane, learned-downsample, mamba, d128, kan-projection, supcon, lr3e-4, label-smoothing, main]
    notes: >
      M23 optimization-stability ablation. Keeps the KAN projection head,
      Mamba backbone, and label-smoothing loss, but resets the sampler to
      none to match M18, lowers AdamW lr to 3e-4, extends scheduler warmup to
      15 epochs, and weakens/delays supervised contrastive learning with
      weight 0.02 starting at epoch 10.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05
  supervised_contrastive:
    enabled: true
    weight: 0.02
    temperature: 0.1
    embedding_key: embedding
    start_epoch: 10
    warmup_epochs: 10

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: true
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
