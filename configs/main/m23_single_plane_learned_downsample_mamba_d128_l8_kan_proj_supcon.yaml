experiment:
  name: m23_single_plane_learned_downsample_mamba_d128_l8_kan_proj_supcon
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    token_dropout: 0.05
    # --- KAN feature projection head (the M23 innovation) ---
    # KAN projects Mamba backbone features into a structured embedding space
    # shaped by supervised contrastive loss. Unlike M19 (KAN as classifier),
    # here KAN acts as a feature transformer: its spline-based local support
    # creates peak-anchored embeddings that SupCon then clusters by class.
    projection_head: kan
    projection_dim: 128
    projection_hidden: [256]
    projection_dropout: 0.1
    projection_normalize: true
    kan_grids: 8
    # classifier remains MLP (same as M18)
    head: mlp
    mamba:
      wa_layers: 8
      dropout: 0.05

optim:
  name: adamw
  lr: 6.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 10

train:
  epochs: 100
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0
  start_epoch: 40

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m23, single-plane, learned-downsample, mamba, d128, kan-projection, supcon, label-smoothing, main]
    notes: >
      M18 ablation adding a KAN projection head with supervised contrastive
      learning. Hypothesis: KAN's spline-based local support creates
      peak-anchored embeddings that SupCon clusters by class, improving
      long-tail discrimination without sacrificing Top-1 accuracy. This
      tests whether KAN's value lies in feature projection (XCCP-style)
      rather than classification (M19 which overfitted).
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05
  supervised_contrastive:
    enabled: true
    weight: 0.05
    temperature: 0.1
    embedding_key: embedding
    start_epoch: 1
    warmup_epochs: 10

sampler:
  name: class_balanced
  power: 0.5
  replacement: true
  num_samples_multiplier: 1.0

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: true
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
