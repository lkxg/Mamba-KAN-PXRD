experiment:
  name: m49_single_plane_learned_downsample_mamba_d128_l10_label_smoothing
  seed: 42
data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true
model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range:
    - 5.0
    - 90.0
    use_sa: false
    d_model: 128
    downsample_channels:
    - 64
    - 128
    - 256
    downsample_blocks_per_stage:
    - 2
    - 2
    token_dropout: 0.05
    mamba:
      wa_layers: 10
      dropout: 0.05
optim:
  name: adamw
  lr: 0.0006
  weight_decay: 0.0005
  betas:
  - 0.9
  - 0.999
scheduler:
  name: cosine
  warmup_epochs: 20
train:
  epochs: 120
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true
early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 60
logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags:
    - h100
    - m49
    - mamba-depth
    - l10
    - single-plane
    - learned-downsample
    - mamba
    - d128
    - label-smoothing
    - main
    notes: 'M18-controlled Mamba depth ablation: increase WA Mamba layers from 8 to
      10 while keeping d_model=128, learned-downsample frontend, loss, optimizer,
      and schedule unchanged.'
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false
loss:
  name: label_smoothing
  label_smoothing: 0.05
sampler:
  name: none
metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100
performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: true
  compile_mode: default
checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
