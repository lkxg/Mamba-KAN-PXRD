experiment:
  name: m14_dual_plane_mamba_kan_gate_aux_label_smoothing
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 256
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    theta_min: 5.0
    theta_max: 90.0
    sa_range: [5.0, 15.0]
    wa_range: [10.0, 90.0]
    use_sa: true
    use_wa: true
    d_model: 32
    sa_conv_channels: [32, 64, 128]
    wa_conv_channels: [32, 64, 128, 256]
    sa_blocks_per_stage: [1, 1, 1]
    wa_blocks_per_stage: [1, 1, 1, 1]
    pool_every_stage: true
    pool_type: max
    token_mode: multiply
    token_dropout: 0.05
    branch_dropout: 0.1
    fusion: gated
    fusion_dim: 256
    gate: kan
    gate_hidden: [256]
    gate_groups: 16
    gate_dropout: 0.1
    kan_grids: 8
    head: mlp
    head_hidden: [512]
    head_dropout: 0.1
    aux_heads: true
    sa_aux_weight: 0.1
    wa_aux_weight: 0.1
    mamba:
      backend: auto
      sa_layers: 2
      wa_layers: 4
      d_state: 16
      d_conv: 8
      expand: 2
      dropout: 0.05

optim:
  name: adamw
  lr: 6.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 5

train:
  epochs: 100
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 50
  drop_last: true

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.0
  start_epoch: 50

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m14, dual-plane, mamba, kan-gate, aux-heads, resconv, plane-token, label-smoothing, main]
    notes: Dual SA/WA angle-token Mamba-ResConv model with KAN fusion gate and branch auxiliary losses.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: class_balanced
  power: 0.5
  replacement: true
  num_samples_multiplier: 1.0

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.4
    macro_acc1_weight: 0.6
