experiment:
  name: m04_dual_gated_mamba_label_smoothing
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 384
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_range
  dual_range:
    theta_min: 5.0
    theta_max: 90.0
    sa_range: [5.0, 15.0]
    wa_range: [10.0, 90.0]
    use_sa: true
    use_wa: true
    add_angle_channel: false
    fusion: gated
    head: mlp
    head_hidden: [512]
    head_dropout: 0.1
    aux_heads: false
    sa_base_channels: 24
    sa_blocks_per_stage: [2, 2, 2]
    wa_base_channels: 64
    wa_blocks_per_stage: [3, 4, 6, 3]
    stem_kernel: 15
    stem_stride: 4
    stem_pool: true
    mamba:
      backend: auto
      sa_layers: 1
      wa_layers: 3
      d_state: 16
      d_conv: 4
      expand: 2
      dropout: 0.05

optim:
  name: adamw
  lr: 7.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 4

train:
  epochs: 40
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 50
  drop_last: true

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: offline
    group: main_results
    job_type: train
    tags: [h100, m04, dual-range, gated, mamba, label-smoothing, main]
    notes: Main dual-range gated Mamba model with label smoothing loss.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05
  focal_gamma: 2.0
  class_weight_power: 0.30
  class_weight_beta: 0.999

sampler:
  name: none
  power: 0.5
  replacement: true
  num_samples_multiplier: 1.0

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.4
    macro_acc1_weight: 0.6
