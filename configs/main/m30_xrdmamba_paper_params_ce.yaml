experiment:
  name: m30_xrdmamba_paper_params_ce
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 256
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    # XRDMamba paper-style single crystal-plane sequence:
    # angle token embedding dimension k=8, intensity-weighted tokens,
    # 8 Mamba blocks, d_state=16, followed by ResConv + MLP classifier.
    frontend: plane_token
    theta_min: 5.0
    theta_max: 90.0
    wa_range: [5.0, 90.0]
    use_sa: false
    use_wa: true
    d_model: 8
    wa_d_model: 8
    wa_conv_channels: [32, 64, 128, 256]
    wa_blocks_per_stage: [1, 1, 1, 1]
    pool_every_stage: true
    pool_type: max
    token_mode: multiply
    wa_token_stride: 1
    token_dropout: 0.0
    branch_dropout: 0.0
    fusion: concat
    head: mlp
    head_hidden: [512]
    head_dropout: 0.0
    aux_heads: false
    mamba:
      backend: auto
      wa_layers: 8
      d_state: 16
      d_conv: 4
      expand: 2
      dropout: 0.0

optim:
  name: adam
  lr: 5.0e-5
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 20

train:
  epochs: 100
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: false

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: main_results
    job_type: train
    tags: [h100, m30, xrdmamba-paper-params, plane-token, mamba, ce, main]
    notes: "XRDMamba paper-param control: k=8, 8 Mamba blocks, d_state=16, Adam lr=5e-5 wd=1e-5, 100 epochs, 20 warmup. ResConv channel schedule and MLP hidden size use this repo's fixed XRDMamba-style implementation because the paper does not specify them."
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: ce

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: false
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
