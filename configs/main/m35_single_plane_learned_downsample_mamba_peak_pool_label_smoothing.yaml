experiment:
  name: m35_single_plane_learned_downsample_mamba_peak_pool_label_smoothing
  seed: 42

data:
  root: dataset
  splits_csv: splits/splits.csv
  task: space_group
  batch_size: 512
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true

model:
  name: dual_plane_mamba
  dual_plane_mamba:
    frontend: learned_downsample
    wa_range: [5.0, 90.0]
    use_sa: false
    d_model: 128
    downsample_channels: [64, 128, 256]
    downsample_blocks_per_stage: [2, 2]
    token_dropout: 0.05
    branch_dropout: 0.1
    head: mlp
    mamba:
      wa_layers: 8
      dropout: 0.05
    peak_branch:
      enabled: true
      encoder: pool
      top_k: 128
      d_model: 128
      wavelength: 1.5406
      smoothing_kernel: 5
      local_window: 17
      token_dropout: 0.05
      branch_dropout: 0.05
      fusion: residual_gated
      init_scale: 0.05
      gate_hidden: [128]
      gate_dropout: 0.05

optim:
  name: adamw
  lr: 6.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 15

train:
  epochs: 100
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  log_every: 100
  drop_last: true

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0
  start_epoch: 50

logging:
  wandb:
    enabled: true
    project: mamba-kan-pxrd
    entity: null
    mode: online
    group: peak_token
    job_type: train
    tags: [h100, m35, single-plane, learned-downsample, mamba, peak-token, peak-pool, label-smoothing]
    notes: >
      M34 control with the same compact top-128 Bragg peak token features and
      residual gated fusion, but no Mamba mixer in the peak branch.
    dir: wandb
    save_code: true
    watch_model: false
    watch_log: gradients
    watch_log_freq: 100
    log_best_checkpoint: false

loss:
  name: label_smoothing
  label_smoothing: 0.05

sampler:
  name: none

metrics:
  rare_min_train_count: 1
  rare_max_train_count: 100

performance:
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  compile: true
  compile_mode: default

checkpoint:
  out_dir: checkpoints
  save_best: true
  monitor: val_balanced_acc1_macro
  mode: max
  balanced_metric:
    acc1_weight: 0.5
    macro_acc1_weight: 0.5
